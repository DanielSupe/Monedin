schema: spec-driven

context: |
  Las reglas de desarrollo vinculantes viven en CLAUDE.md, en la raíz del repositorio:
  anatomía de módulo, patrón de actor, contrato de errores, atomicidad del saldo y
  exigencia de tests. Este contexto no las repite; da el marco de producto y las
  decisiones ya cerradas.

  PRODUCTO
  Monedín: plataforma de educación financiera gamificada para niños de 6 a 11 años.
  Los padres asignan tareas con valor en monedas y publican premios con precio en monedas.
  El niño gana monedas completando tareas (con aprobación del padre) y las gasta canjeando
  premios (también con aprobación). La moneda es virtual y cerrada a la familia: no hay dinero
  real, no hay pagos, no hay interoperabilidad entre familias.
  Primer mercado: Latinoamérica hispanohablante.

  Lo que enseña, y que ninguna decisión debe diluir: el ciclo esfuerzo → ingreso → decisión
  de gasto. No es una app bancaria para niños ni un gestor de tareas: la clave es que las
  tareas valen monedas y los premios cuestan monedas.
  Para el padre es una herramienta de gestión del hogar con impacto educativo; para el niño,
  una experiencia de autonomía donde ve su saldo y elige sus metas.

  STACK
  Monorepo con pnpm workspaces + Turborepo. Node 22 LTS, TypeScript strict.
  - apps/api: Express + Prisma 7 + PostgreSQL 16.
  - apps/web: Vite + React + TanStack Query + TanStack Router.
  - packages/contracts: schemas Zod, tipos y constantes de dominio compartidos front/back.
  - packages/config: tsconfig, eslint y prettier compartidos.
  Infra local: docker-compose con PostgreSQL 16 + Adminer + MinIO (almacen S3-compatible).
  Archivos subidos (imágenes): S3 detrás de una interfaz StorageProvider, con URLs firmadas.
  Tests: Vitest + Supertest, contra PostgreSQL real en una base separada.

  ARQUITECTURA
  Arquitectura por módulos. Cada módulo de la API tiene la misma anatomía:
    modules/<name>/<name>.routes.ts       monta rutas, cero lógica
    modules/<name>/<name>.controller.ts   parsea y serializa, cero autorización
    modules/<name>/<name>.service.ts      reglas de negocio Y autorización
    modules/<name>/<name>.repository.ts   único lugar que toca Prisma
    modules/<name>/<name>.errors.ts       errores de dominio del módulo
  El módulo health es la plantilla ejecutable de esa anatomía.

  La autorización se valida en la capa de negocio, nunca en el controlador. El controlador
  construye el actor desde la sesión y lo pasa como primer argumento: service.method(actor, dto).
  El actor es una unión discriminada, porque el niño no es un User y no tiene userId:
    { familyRole: "PARENT", userId }
    { familyRole: "CHILD", childProfileId, parentId }

  MODELO DE DATOS (ya implementado, ver apps/api/prisma/schema.prisma)
  User (solo el padre) · ChildProfile (el niño entero: nombre, PIN, saldo, edad, avatar,
  baja lógica) · Task · Reward · RewardAssignment (precio por niño, clave compuesta) ·
  RewardRedemption (precio congelado al solicitar) · CoinTransaction (historial append-only).

  El motor garantiza los invariantes, no solo el código: CHECK para saldo no negativo, rangos
  de monedas y de edad, y un disparador que hace inmutable el historial.

  MÁQUINAS DE ESTADO
  Tarea:  PENDING --(el niño la marca)--> COMPLETED --(el padre aprueba)--> APPROVED [+monedas]
          COMPLETED --(el padre rechaza)--> PENDING. Solo se edita en PENDING.
          Completar solo el niño dueño; aprobar y rechazar solo el padre dueño.
  Canje:  PENDING --(aprueba)--> APPROVED [-monedas]  |  PENDING --(rechaza)--> REJECTED (terminal).
          El niño solo puede pedir un premio que exista, esté activo, esté asignado a él y cuyo
          precio no supere su saldo. El saldo se valida DOS veces: al solicitar y al aprobar.

  SUPERFICIE DE LA API PREVISTA (todo bajo /api/v1)
  Lo ya construido:
    GET /health  público, sonda de vida, no consulta la base de datos.
    /children   POST de SOLO CUENTA: se crea desde la rejilla sin PIN de adulto, porque crear un
                perfil es otro de los pasos previos a ser alguien. Un perfil de NIÑO activo no
                puede (403). Tope de hijos activos por familia impuesto en el servicio (409).
                GET paginado y GET /:id (padre, solo hijos propios). Ajeno o dado de baja -> 404,
                nunca 403, para no confirmar que existe.
                PATCH /:id (padre): nombre, edad y avatar. NUNCA el saldo.
                DELETE /:id (padre): baja LOGICA y DEFINITIVA, sin reactivacion. Revoca las
                sesiones abiertas de ese perfil y conserva su historial.
                GET y PATCH /children/me (niño): su perfil con su saldo, y su avatar. El perfil
                sale de la sesion y nunca de la peticion, asi que no ve a sus hermanos.
                El PIN propio del niño NO vive aqui: POST /auth/child-profiles/me/pin, porque
                cambiar una credencial toca la tabla de sesiones y esa es exclusiva de auth.
                Estas rutas estrenaron el patron de paginacion del proyecto.
    /tasks      POST (padre) acepta DOS formas y debe cumplirse EXACTAMENTE una:
                  A) { childIds: [...], coins }  mismo valor para todos
                  B) { assignments: [{ childId, coins }] }  valor distinto por hijo
                Se crea UNA FILA POR HIJO y se devuelve el array. El reparto es TODO O NADA:
                se comprueban todos los hijos antes de crear nada, y un hijo ajeno, inexistente
                o dado de baja da 404 -> nunca 403, para no confirmar que existe. (El boceto
                decia 403 para el ajeno; se corrigio en add-tasks por coherencia con /children.)
                Las filas creadas en el mismo POST comparten `batchId`, que es el REPARTO.
                GET (padre) devuelve los repartos AGRUPADOS y pagina POR REPARTO, con filtros
                por estado y por hijo. Filtrar por COMPLETED es la bandeja de aprobacion. El
                filtro por estado ensena el reparto entero; el de hijo acota tambien las filas.
                GET /tasks/mine (niño) su lista plana, tomada de la sesion y nunca de la query.
                GET /:id (ambos roles, cada uno con su vista, filtrando por pertenencia).
                PATCH /:id (padre, solo en PENDING). DELETE /:id (padre, solo en PENDING).
                POST /:id/complete (niño) · /approve y /reject (padre). POST y no PATCH:
                aprobar tiene efecto secundario sobre el saldo y no es idempotente.
                Aprobar ACREDITA en la misma transaccion que el cambio de estado, condicionado
                al estado de origen: dos toques dan una acreditacion y un 409.
    /rewards    Un premio es UNA fila; lo que se multiplica es la ASIGNACION (precio propio por
                hijo), no el premio, a diferencia de las tareas. POST (padre) acepta las mismas
                DOS formas que /tasks para el precio -childIds+coins o assignments-, con la
                MISMA regla compartida de `coins-per-child`. TODO O NADA: se comprueban todos los
                hijos antes de crear nada, 404 y no 403 para el ajeno o inexistente.
                GET (padre) el catalogo paginado, con TODAS las ofertas de cada premio y un
                filtro `status=ACTIVE|RETIRED` (ACTIVE por defecto).
                GET /rewards/mine (niño) su escaparate: solo activos ofrecidos a el, con SU
                precio y si `affordable` -pista de interfaz, no una reserva-, tomado de la
                sesion y nunca de la peticion.
                GET /:id (ambos roles, cada uno con su vista: `Reward` con todas las ofertas o
                `OwnReward` con una sola, nunca la misma forma con un parametro).
                PATCH /:id (padre): titulo y descripcion. NUNCA el precio -es 422-, porque el
                precio no vive en el premio sino en la oferta a cada hijo.
                PUT /:id/assignments (padre): REEMPLAZA el conjunto COMPLETO de ofertas de una
                vez -borra y recrea en una transaccion-, no altas/bajas por hijo. Un conjunto
                vacio es valido: retira la oferta a todos sin retirar el premio.
                DELETE /:id (padre): retiro LOGICO, no destruye ofertas ni canjes previos. Cero
                filas afectadas es 404 y no 409: retirar no mueve monedas.
                Sin migracion: `Reward` y `RewardAssignment` ya estaban desde `add-data-model`.
    /redemptions  El niño solicita el canje de un premio ofrecido a él (POST), congelando en la
                solicitud el precio de la oferta EN ESE MOMENTO. El saldo se valida DOS veces:
                al solicitar (404 si el premio no existe/no esta activo/no le fue ofertado -nunca
                403-, 409 si ya tiene un PENDING del mismo premio, 409 si el saldo no alcanza) y
                otra vez al aprobar, donde `applyCoinMovement` ya hace esa comprobacion de forma
                atomica y su ConflictError generico sube sin envolver -tambien lo produce un hijo
                dado de baja entre solicitar y aprobar, y distinguir los dos casos mentiria en el
                segundo-.
                GET (padre) la bandeja paginada de sus hijos, con filtro por `status` y por
                `childId`. GET /redemptions/mine (niño) sus propias solicitudes, tomado de la
                sesion y nunca de la peticion. GET /:id (ambos roles: `Redemption` con el hijo o
                `OwnRedemption` sin el, nunca la misma forma con un parametro).
                POST /:id/approve (padre) deja el canje en APPROVED y DESCUENTA el precio
                CONGELADO -nunca el vigente de la oferta si cambio despues-, en la misma
                transaccion que la transicion condicionada al estado de origen: dos toques dan
                un descuento y un 409, y el perdedor sigue PENDING.
                POST /:id/reject (padre) deja el canje en REJECTED, terminal, sin mover monedas.
                Retirar el premio o quitarle la oferta al hijo NO afecta un canje ya PENDING: el
                precio ya esta congelado, y aprobar solo revalida el saldo.
                SEIS rutas: un canje no se edita ni se retira, solo se resuelve -sin PATCH, PUT
                ni DELETE-. Sin cancelacion del niño en este alcance: solo el padre resuelve.
                Sin migracion: `RewardRedemption`, `RedemptionStatus` y
                `CoinReason.REDEMPTION_APPROVED` ya estaban desde `add-data-model`.
    /coins      SOLO LECTURA del historial, y el primer cambio de API de la etapa de interfaz.
                Modulo propio `coins` y no dentro de `children`: la anatomia ata un modulo a lo que
                CONSULTA -aqui `coin_transactions`- y no a lo que dice su URL, igual que reponer el
                PIN de un hijo vive en `auth`.
                GET /children/me/coins (niño) NO admite ningun identificador, ni en ruta ni en query,
                y su esquema es `.strict()`: la garantia de que no lee el de su hermano es que no
                existe el parametro que apuntaria a otro, no una comprobacion. Importa mas que en
                otros listados porque los hermanos comparten la tablet y un historial es el registro
                mas detallado de lo que otro niño hizo y gasto.
                GET /children/:childId/coins (padre): el SERVICIO comprueba la propiedad, y un hijo
                ajeno responde 404 y no 403.
                Cada fila devuelve su `balanceAfter` GUARDADO, que es para lo que la columna se
                escribe redundante desde `add-data-model`. La pantalla no acumula: sumar en el
                cliente ademas seria incorrecto en cuanto pagina, porque la pagina 2 no sabe con que
                saldo empezo.
                Pagina como todo, con desempate por identificador, que aqui no es teorico: aprobar un
                reparto escribe varias filas en el mismo instante.
                Se llega desde el SALDO en los dos roles, y no como destino nuevo en la navegacion.
                Sin migracion: la tabla, su disparador y sus restricciones ya existian.
    IMAGENES    El binario NUNCA pasa por la API. Tres pasos: el cliente pide una URL firmada al
                endpoint del modulo dueño, sube con un PUT directo al almacen, y confirma la MISMA
                clave contra el endpoint de dominio que YA existia para guardar esa referencia.
                POST /children/me/avatar/upload-url (niño) y /children/:childId/avatar/upload-url
                (padre); POST /auth/avatar/upload-url y PATCH /auth/avatar (el avatar del padre vive
                en `auth` porque `User.image` es de ese modulo, y su actor ahora SI lo expone);
                POST /rewards/:rewardId/image/upload-url; POST /tasks/:taskId/evidence/upload-url
                (niño, solo mientras la tarea siga PENDING).
                Antes de guardar una clave se comprueban DOS cosas y hacen falta las dos: que
                empiece por el prefijo del dueño -si no, quien vio la clave de otro la confirmaria
                como suya- y que el objeto exista -si no, se guarda una referencia rota-. El
                prefijo lo decide cada modulo; `isConfirmableUpload` hace las dos juntas.
                La firma ata el `Content-Type` con `signableHeaders`: sin eso el SDK solo firma
                `host` y una URL para una imagen sirve para subir cualquier cosa.
                Se guarda la CLAVE, nunca una URL: las de lectura se firman al serializar y caducan.
                El avatar tiene DOS formas de entrada excluyentes -`avatar` del catalogo o
                `avatarUploadKey`- y UNA de lectura -clave corta o URL firmada-.
                El alta de un premio SI acepta foto desde `polish-profile-and-reward-image`, y
                antes no. La regla no se relajo: lo que cambio es DE QUE CUELGA una clave todavia
                sin dueño. Al editar cuelga del premio -`rewards/{rewardId}/`-; al publicar cuelga
                del PADRE -`rewards/pending/{userId}/`-, que si existe, porque publicar un premio ya
                exige perfil de padre.
                Por eso hay DOS vias de subida y conviven: POST /rewards/image/upload-url para el
                alta y POST /rewards/:rewardId/image/upload-url para la edicion. La primera se
                conforma con `requireParent` y NO con la cuenta, asi que la lista cerrada de rutas de
                solo cuenta sigue en CINCO y su test pasa sin tocarlo.
                Las dos comprobaciones de siempre siguen juntas: prefijo y existencia. Y la clave se
                queda bajo el prefijo del padre para siempre -no se copia al del premio-, con la
                consecuencia escrita: el prefijo de una clave YA GUARDADA no identifica al premio
                dueño, y solo se usa al confirmar, contra quien sube.
                Esto NO desbloquea la foto al CREAR un perfil de hijo, que sigue aparcada: lo que a
                aquella le falta no es como nombrar una clave sin dueño -eso queda resuelto aqui-
                sino que su alta ocurre SIN perfil activo, y su via de subida seria una sexta ruta
                de solo cuenta.
                Un premio SIN foto se dibuja con un respaldo -un glifo- y no con un hueco, en el
                catalogo del padre y en el escaparate del niño. El respaldo NO se resuelve en la API:
                el servidor sigue diciendo que no hay imagen, que es la verdad.
                La evidencia de una tarea es OPCIONAL y se valida ANTES de la transicion: si falla,
                la tarea sigue PENDING.
                Una sola migracion: `Task.evidenceKey`. `ChildProfile.avatar`, `User.image` y
                `Reward.image` ya estaban desde `add-data-model`.
                MinIO en docker-compose para desarrollo y tests; S3 real en produccion con
                S3_ENDPOINT vacio.
                La bateria de tests esta aislada del almacen real por TRES vias, no dos: bucket
                propio, endpoint propio -TEST_S3_ENDPOINT, que no admite vacio- y credenciales
                propias -TEST_AWS_*-. La tercera llego en `split-test-storage-credentials`, y su
                ausencia se noto en cuanto alguien apunto desarrollo al S3 real: los tests seguian
                hablando con MinIO pero con una llave de AWS, y morian con InvalidAccessKeyId.

  FRONT (etapa de interfaz y diseno, en curso)
    El front era un andamio funcional sin una sola linea de CSS: clientes de API validados con Zod,
    hooks de TanStack Query y veinticuatro componentes con estilos en linea. La API esta terminada;
    lo que se construye ahora es lo que se ve.

    `add-design-system` es el cimiento y no toca ninguna pantalla de producto:
      - Tailwind 4 con el tema en CSS (`@theme` dentro de `apps/web/src/styles/tokens.css`), que es
        la fuente UNICA de color, medida, radio, sombra y duracion. Tres capas, y un componente solo
        puede usar la de en medio: los primitivos viven fuera de `@theme` para que Tailwind no genere
        utilidades con ellos y saltarse la regla sea imposible, no solo desaconsejado.
      - DOBLE ESCALA: `data-scale="child" | "parent"` en el contenedor reasigna tipografia, radios y
        objetivo de toque SIN duplicar una sola pieza. Es la traduccion tecnica de que Monedin son
        dos productos en una app. El shell lo pondra en `add-app-shell`.
      - Quince piezas en `apps/web/src/ui/`, con Radix solo donde la accesibilidad no se improvisa
        (dialogo, pestanas, avisos). Una pieza NO importa nada de `features/` ni de `api/`, y por eso
        se prueba sin servidor.
      - Infraestructura de test de componentes (jsdom + testing-library), que antes no existia.
      - Tres reglas cumplibles: ESLint prohibe el prop `style` -con `allowInlineStyles()` para la
        excepcion declarada-, y dos tests cazan colores literales y valores arbitrarios.
      - Catalogo vivo en `ui.html`, un punto de entrada APARTE que no se compila en produccion. Sin
        proveedores: si una pieza necesitara uno, el catalogo se rompe, y ese es el aviso.

    Las pantallas de producto siguen SIN vestir y se ven mas planas: el reinicio de estilos entra con
    el sistema. Vestirlas una a una son los nueve changes siguientes, y cada uno borra su entrada de
    las dos listas de deuda declarada -en `apps/web/eslint.config.js` y en el test de estilo-.

    `add-app-shell` es el unico change de la etapa que es arquitectura y no aspecto. El nino no tenia
    NINGUNA ruta: sus cuatro pantallas vivian dentro de `/` con booleanos, asi que el boton atras
    sacaba de la aplicacion. Lo que deja construido:
      - Cada destino con su direccion, incluidas las pantallas previas a ser alguien y los formularios
        que antes eran una vista interna. Mueren los tres `Vista` union y el prop `onDone` de quince
        componentes; dos tests impiden que vuelvan.
      - Tres capas en el front: `ui/` no sabe de dominio ni de rutas, `app/` -los dos marcos- sabe de
        rol y destinos pero no de negocio, `features/` sabe de negocio y ya no sabe de navegacion.
      - Guardas en `beforeLoad`, que deciden ANTES de pintar y por eso REDIRIGEN. El rol equivocado
        aterriza en su inicio en silencio: es interfaz, no seguridad, y la guarda de verdad sigue
        siendo el 401 o el 403 del servidor.
      - Como una guarda solo corre al ENTRAR en una ruta, quien invalida la sesion invalida tambien el
        router. Navegar desde el `onSuccess` de cada mutacion no funciona: al cambiar la sesion, la
        raiz cambia de marco y desmonta el componente que llamo a `mutate`.
      - El filtro y la pagina de un listado viajan en la direccion, y un valor invalido CAE al de por
        defecto -lo contrario del 422 de la API, porque aqui quien llama es una persona con un enlace
        viejo-.

    `add-landing-page` le pone PUERTA al producto. Antes, quien llegaba sin sesion aterrizaba en un
    formulario: ni una frase sobre que es Monedin ni para quien. Lo que deja construido:
      - Una pagina publica en `/welcome`, sin guarda, que explica el ciclo sin pedir un solo dato.
      - Sin sesion, TODO destino lleva alli. Es una constante en `guards.ts`, no una excepcion por
        ruta. `/sign-in` sigue existiendo y se llega desde la landing.
      - Y por eso «Entrar» es accion de primer nivel junto a «Empezar»: la mitad de quien llegue ya es
        usuario con la sesion caducada, y esa proporcion crece con el tiempo.
      - Lo que orbita es el CICLO -tareas, premios, perfiles alrededor de un saldo-, no retratos. La
        visualizacion explica el producto en vez de decorarlo.
      - Pieza `Logo` en `ui/`, con tres consumidores desde el primer dia: la landing y los dos marcos,
        donde «Monedin» era texto suelto repetido.
      - Toda animacion declara su ESTADO FINAL bajo movimiento reducido. El bloque de `tokens.css` no
        basta: poner la duracion a 1ms deja el titular en su primera letra y la cuenta en cero.
      - Cero dependencias nuevas: ni fuentes remotas, ni librerias de animacion, ni imagenes ajenas.

    `add-brand-typography` cumple una promesa que el sistema de diseno ya se habia hecho. El token
    `--font-sans` era solo una pila del sistema, asi que la marca se veia redondeada en Apple y NO en
    Windows ni en Android -la tablet compartida de la casa, el escenario mas probable-. Se elegia una
    cosa y en la mitad de los casos se entregaba otra. Lo que deja construido:
      - Nunito variable, AUTOALOJADA con `@fontsource-variable/nunito`. Dependencia npm, no un CDN: en
        ejecucion no sale nada a la red, y ninguna peticion del front va a un tercero. Un usuario en
        espanol descarga UN archivo de 38 KB: el paquete declara cada subconjunto con su
        `unicode-range`, asi que los otros cuatro no se piden nunca.
      - La pila del sistema se queda DETRAS como respaldo, y no es decorativa: sin ella un fallo de
        carga da la serif por defecto del navegador. Con `font-display: swap`, el texto es visible
        desde el primer fotograma.
      - Cifras tabulares en `Coins`, para que una columna de saldos alinee. En la pieza y no en
        `body`: alinear cifras es correcto en una columna de numeros e incorrecto en un texto corrido.
      - Tres tests impiden la vuelta atras: que la primera familia no sea del dispositivo, que esa
        familia este importada, y que detras quede respaldo. Cambiar de familia es legitimo; volver a
        una pila del sistema, no.
      - Ni un peso, ni un tamano, ni un color. Solo con que formas se dibujan.

    `redesign-profile-grid` viste la rejilla «quien eres?», que es la pantalla que una familia ve cada
    vez que abre la aplicacion y era la menos vestida: una lista en linea con avatares de 3rem. Adopta
    la ESTRUCTURA de Netflix -pregunta centrada, teselas grandes, nombre debajo, modo administrar- con
    nuestros colores, sin paleta oscura y sin cambiar la forma del avatar. Lo que deja construido:
      - Modo ADMINISTRAR: un boton pone un lapiz sobre cada perfil entrable. Al tocar uno se pide EL
        PIN DE ESE PERFIL y se aterriza en su pantalla de edicion: /account para el padre,
        /me/settings para un hijo. Cada quien edita lo suyo con su propia llave.
      - El modo viaja en la DIRECCION y no en un useState, porque tiene que sobrevivir al viaje al
        teclado de PIN: despues de acertarlo quien navega es la guarda, no el componente. De regalo,
        el boton atras sale del modo y recargar lo conserva.
      - El destino lo decide la guarda a partir del ROL DE LA SESION, nunca de lo que pida la
        direccion: nadie puede pedir aterrizar en la pantalla del otro rol.
      - Las dos rutas de perfiles usan ya `requireProfileChoice`. La rejilla se guardaba con
        `requireAccount`, que admite un perfil ya activo, y entonces el lapiz sobre otro perfil
        rebotaba a los ajustes del que estaba dentro SIN PEDIR NINGUN PIN. Lo cazo abrir la
        aplicacion, no un test.
      - El teclado de PIN, vestido y con TECLA DE BORRAR. Sin ella, equivocarse en un digito obligaba
        a completar un PIN que se sabia mal y gastar un intento, y los intentos bloquean el perfil.
      - La deuda declarada de `features/auth` deja de ser un glob del directorio y nombra los cuatro
        archivos que siguen sin vestir, que son de `redesign-access`.

    `add-entry-frame` cierra un hueco que se veia y no se nombraba: las cinco pantallas previas a tener
    rol -acceso, rejilla, teclado de PIN, alta de perfil y restablecer PIN- no tenian marco. Caian en
    el contenedor de lectura de la raiz, pegadas arriba y SIN MARCA: se entraba por una pagina con
    logo, se pasaba por cuatro pantallas anonimas, y el logo volvia al final. Lo que deja construido:
      - `EntryShell`, tercer marco junto a los del padre y el nino: logo arriba a la izquierda y
        contenido centrado en los dos ejes. NO declara escala, porque la escala la elige la audiencia
        y ahi todavia no se sabe quien esta delante.
      - Quienes lo reciben se DEDUCE y no se lista: es la ultima rama de la raiz, o sea sin actor y sin
        pedir ancho completo. Como toda ruta de la aplicacion exige actor, ese conjunto es exactamente
        el camino de entrada, y una pantalla nueva lo hereda sin que nadie se acuerde.
      - El marco centra pero NO impone ancho. Lo intento con el de lectura y partia la rejilla en dos
        filas: solo cada pantalla sabe si es un formulario de 22rem o una fila de caras.
      - Talla `xlarge` en `Avatar`, 8rem, para la rejilla. Es la respuesta que el design de
        `redesign-profile-grid` habia dejado escrita para este caso exacto.

    `polish-profile-tiles` le da PRESENCIA a la rejilla, que se leia como una lista de contactos:
      - Cuadrados redondeados de 9rem en vez de circulos. La forma es una PROP de `Avatar` y no una
        clase desde fuera: `cx` no fusiona utilidades de Tailwind, asi que dos radios los resuelve el
        orden del CSS generado y no el del codigo.
      - Una CORONA en la esquina de la tesela del adulto, con nombre accesible. Antes solo se
        distinguia por la foto, y por nada si el adulto no habia puesto ninguna.
      - Crecimiento al senalar bajo `motion-safe`, con el realce de color encendido en los dos casos.
        Bajar la duracion NO vale: el bloque del sistema pone 1ms y eso convierte el crecimiento en un
        salto instantaneo, peor para quien pidio no ver movimiento.

    `redesign-access` viste la puerta de entrada y arregla un defecto de arquitectura que llevaba dias
    anotado: entrar y registrarse eran la MISMA pantalla con `useState<"signIn"|"signUp">`, estado
    haciendo de router. Por eso «Empezar» en la puerta publica abria el formulario de ENTRAR, y quien
    venia a registrarse aterrizaba donde no podia. Lo que deja construido:
      - Dos rutas, `/sign-in` y `/sign-up`. Un marco comun recibe el formulario como HIJO y no decide
        cual: si tuviera un `if`, habriamos movido el problema en vez de resolverlo.
      - Los cuatro enlaces de la puerta publica repartidos: «Empezar» al registro, «Entrar» al acceso.
      - Campos en PILDORA con icono, como variante de `Input`, y envio circular con flecha. El tipo de
        `Button` EXIGE `aria-label` cuando es solo icono: una flecha sola no dice si envia o vuelve.
      - La etiqueta se queda encima. La maqueta de referencia usa solo marcador de posicion, y eso
        borra que campo era en cuanto alguien escribe.
      - Una CINTA bajo el saludo: el ciclo -tarea, moneda, premio- en linea recta y sin fin, lo mismo
        que orbita en la puerta publica. Con clases y un keyframe, SIN pedir una tercera excepcion de
        `allowInlineStyles()`: no es geometria calculada como las orbitas.
      - El minimo de la contrasena se lee antes de fallar, desde la constante del contrato, y el
        registro explica para que sirve cada una de las dos credenciales.

        `polish-brand-surface` empezo como un arreglo de acabado del panel ambar del acceso y acabo
    CAMBIANDO EL COLOR, porque el acabado no era el problema. El acceso es la unica pantalla que mira
    un adulto: la calidez le corresponde al nino -su inicio, sus tareas, sus premios- y en la puerta
    se lee como juguete justo donde alguien decide si esto es de fiar. Lo que deja construido:
      - INDIGO PROFUNDO como superficie del acceso, y el ambar pasa de fondo a ACENTO: el boton y la
        moneda. Pintando media pantalla no decia nada; sobre indigo, un punto ambar ES dinero. La
        rejilla, el PIN y la puerta publica siguen claros.
      - Los neutros Y LAS SUPERFICIES se reasignan por superficie, igual que los tamanos por
        audiencia. Sobre oscuro no basta con invertir la tinta: `--color-surface-raised` tambien se
        reasigna, asi que un campo pasa a ser oscuro con texto claro y las piezas componen solas.
      - Y hace falta el camino de VUELTA: un componente que pinta su propio fondo claro -`Alert`- es
        una superficie clara este donde este, y lo declara el componente, no la pantalla.
      - Una utilidad de color resuelve el token DONDE se escribe, no donde acaba el pixel. `text-ink`
        en el contenedor de fuera bajaba ya resuelto y el saludo salia invisible sobre el indigo.
      - Variante `contrast` en `Button`, nombrada por el PAPEL. Paso de tinta oscura a ambar al
        cambiar la superficie SIN tocar su nombre ni un punto de uso: la prueba de por que se nombra
        asi.
      - La orbita del acceso pasa a ser la de la puerta publica simplificada: tres anillos, sus
        radios, y seis iconos en vez de nueve. Sin estilos en linea, girando el anillo entero en vez
        de calcular angulos.

    Nada de esto sale de los selectores de superficie, asi que el resto de la aplicacion no cambia.
    Eso se comprueba ABRIENDO pantallas del padre y del nino, porque no lo cubre ningun test.

    `redesign-child-home` viste la primera pantalla de PRODUCTO. El inicio del nino tenia su saldo en
    negrita dentro de una frase, al mismo tamano que los enlaces de al lado, aunque la escala del nino
    lleva 4rem reservados para el desde `add-design-system`. Lo que deja construido:
      - El saldo primero y lo mas grande, con la pieza `Coins`, que ademas lo anuncia como «120
        monedas» y no como un numero suelto.
      - Los cuatro destinos pasan de enlaces subrayados a tarjetas: un enlace de una linea es un
        objetivo de la altura de una letra para una mano de seis anos en una tablet compartida.
      - Las DOS pantallas de inicio salen del archivo de ruta a `features/`. Un archivo de ruta monta
        el destino, no lo dibuja; elegir por rol sigue siendo legitimo, pero lo elegido vive fuera. La
        del padre se muda TAL CUAL y espera a `redesign-parent-home`.
      - Al estrechar `features/auth` por archivos, mudar codigo sin vestir alli lo deja fuera de su
        excepcion. Sus estilos se tradujeron uno a uno a utilidades: traducir no es vestir.

    `redesign-child-tasks` cierra el area del nino salvo la tienda. Lo que deja construido:
      - Las tareas del nino con sus TRES etapas distinguibles de un vistazo -pendiente, esperando
        revision, pagada- y solo la pendiente ofreciendo marcarla, que es lo unico que la API
        permite: la interfaz deja de poder pedir algo que acabaria en 409.
      - «Mi perfil» del nino, que era la pantalla sin change asignado. Entro aqui porque compartia la
        CAUSA del desbordamiento, no por hueco.
      - `ImageUploadField` vestido, y con el la correccion de fondo: un `input[type=file]` pide unos
        360px de ancho minimo intrinseco y en una rejilla arrastra a su columna. Dos pantallas
        desbordaban por el SIN tenerlo en su codigo. Ahora va absoluto y a opacidad cero cubriendo su
        etiqueta: fuera del flujo, y con su caja de foco encima de lo que se ve.
      - Se RETIRA el `overflow-x-auto` de `ChildShell`, que llevaba desde `add-app-shell` esperando a
        este change. Medidas las cinco pantallas antes y despues.
      - TERCERA excepcion de estilos en linea, acotada a `ImageUploadField`: `react-easy-crop`
        dimensiona su lienzo en tiempo de ejecucion. Cierra la pregunta que dejo abierta el design de
        `add-design-system`. El color literal que habia se fue a un token.

        `redesign-child-shop` cierra EL AREA DEL NINO ENTERA: su escaparate y sus canjes.
      - Estrena `ProgressBar`, escrita en `add-design-system` para este caso exacto -lo dice su
        cabecera- y que hasta hoy solo usaba el catalogo. Es ademas la PRIMERA excepcion de estilos en
        linea del proyecto, justificada por «el ancho depende del saldo de un nino y de lo que cuesta
        un premio». La cifra se queda junto a la barra: la barra dice «estas por aqui» y el numero
        dice cuanto exactamente.
      - «Ya lo pediste» pasa de parrafo a ESTADO. Lo que se ve y lo que se puede hacer van juntos.
      - Los tres estados de un canje se distinguen. RECHAZADO va en advertencia y no en peligro, por
        la misma razon por la que `Alert` pinta un conflicto en ambar: nadie hizo nada mal. Que un
        padre diga que no a un premio no es un error del nino.
      - No devuelve monedas, porque el descuento solo ocurre al aprobar. La pantalla lo ensena, no lo
        cambia.

        DECISION CERRADA: el SALDO no se ve en la rejilla. Se pidio y se descarto. No es una limitacion
    tecnica -`GET /auth/profiles` no lo devuelve porque `profile-selection` lo prohibe-. Dos precios:
    cualquiera con la tablet desbloqueada veria todos los saldos SIN teclear un PIN, y los hermanos se
    compararian cada vez que se abre la aplicacion. No se reabre sin argumento nuevo sobre lo segundo.

    APLAZADO HASTA NUEVO AVISO (2026-09-03): no se puede subir una foto al CREAR un perfil, solo
    elegir un animal. Se plantearon los tres caminos y se decidio dejarlo parado. No proponerlo como
    siguiente change sin que se pida.
    Lo que SI quedo resuelto, en `polish-profile-and-reward-image` y para los premios: como se sube
    una imagen para algo que todavia no existe CUANDO HAY ACTOR. La clave cuelga de quien la sube,
    se confirma con prefijo y existencia, y los objetos huerfanos no se borran.
    Lo que a esta le sigue faltando es justo lo otro: el alta de un perfil ocurre SIN perfil activo
    -es la quinta ruta de solo cuenta-, asi que su via de subida seria la SEXTA, y esa lista esta
    cerrada en un test cuyo comentario dice que la pregunta no es como arreglar el test sino por que
    esa ruta no puede exigir actor. El otro camino, en dos momentos, no sirve desde la rejilla.

    LOS TRES DESTINOS DEL NINO SE DISTINGUEN POR SU FORMA, desde
    `redesign-child-surfaces`. Eran los tres `<ul flex flex-col gap-3>` con un li/Card dentro,
    identicos hasta en la clase, porque cada uno se vistio por separado y resolvio bien SU contenido
    dentro de la unica forma que habia. Son los tres tiempos del ciclo:
      - Escaparate: REJILLA de dos columnas. Comparar dos precios sin desplazar es lo que se hace
        ahi, y es la mitad del ciclo que el producto ensena. Sigue siendo una lista: una rejilla es
        una colocacion, no otra estructura para quien no ve la pantalla.
      - Tareas: columna ancha de tarjetas. Es el UNICO de los tres con una accion que cambia el
        mundo —marcarla— y una foto opcional que adjuntar, asi que es el que necesita sitio.
      - Canjes: TABLA. Cuatro datos por fila, siempre los mismos, sin nada que hacer con ellos.
    Las tres dicen cuantas cosas hay, y cada una cuenta lo suyo: premios de las filas recibidas,
    tareas PENDIENTES —no el total, que una lista de ocho con siete aprobadas no es ocho cosas por
    hacer— y canjes del `total` del listado, que aqui SI es la cifra porque pagina por fila.
    `ui/DataTable` es la primera pieza nueva del sistema desde `add-design-system`. Recibe
    encabezados y celdas ya compuestas, como `Pagination` recibe sus enlaces, y sin filas no dibuja
    nada: una tabla vacia con encabezados dice «esto esta roto» donde el estado vacio dice «todavia
    no hay nada».

    RECORTAR Y REDIMENSIONAR SON DOS DECISIONES, desde `crop-reward-images`. Eran una sola prop
    —`aspect` decidia si se recortaba Y, via una bandera `forAvatar`, si el resultado bajaba a 512 o
    a 1280 px—, y coincidian mientras lo unico que se recortaba era lo unico que se guardaba pequeno.
    La foto de un premio rompe la coincidencia: recorta y necesita detalle.
      - Avatar: recorta cuadrado, guarda a AVATAR_MAX_DIMENSION.
      - Premio: recorta cuadrado, guarda a PHOTO_MAX_DIMENSION. Las DOS vias de entrada —el alta y la
        edicion— recortan, o el catalogo acaba con fotos de dos clases segun por donde entraron.
      - Evidencia: NO recorta, guarda a PHOTO_MAX_DIMENSION. Se mira de una en una en la bandeja del
        padre, no junto a otras del mismo tamano, y lo que hay que ver es el conjunto.
    El premio comparte FORMA con el avatar y TAMANO con la evidencia: con las dos decisiones atadas,
    uno de esos dos pares era imposible de expresar.
    La imagen de un premio se dibuja ademas en una CAJA de proporcion fija, la misma para la foto y
    para el respaldo, con un tope de ancho por tesela. El recorte endereza las fotos NUEVAS; la caja
    arregla tambien las viejas, que conservan su proporcion, sin reprocesar nada en el almacen.

    LA PUERTA PUBLICA, compuesta como pagina desde `redesign-public-entry`. Se habia construido por
    partes y nunca se miro entera: cinco bloques seguidos sobre el mismo fondo.
      - Heroe con las orbitas de PROTAGONISTAS —crece su escenario, no sus radios, para no ampliar
        la excepcion de estilo en linea— y la accion principal en una talla nueva del sistema.
      - El CICLO se cuenta como un flujo de cuatro pasos: tarea, TU APRUEBAS, monedas, premio.
        Sustituye a las tres tarjetas de promesa, que decian lo mismo, y al fundirlas aparece el
        orden que a la lista le faltaba: aprobar va ENTRE la tarea y las monedas porque aprobar es
        lo que acredita.
      - La franja de confianza: que la moneda no es dinero real y que lo real es lo que el niño
        aprende. Sin cifras, testimonios ni logos, que habria que inventar.
      - LAS DOS CARAS de la aplicacion, construidas con las piezas y los tokens reales y no
        capturadas —una captura envejece en silencio cuando cambia un token—, cada una con su
        `data-scale` de verdad.
      - Cierre con la accion principal, para quien leyo hasta el final.
      - El RITMO sale de alternar superficies que ya existian; el cierre usa la de marca, que es el
        indigo del acceso. Ni un color nuevo.
    El saldo del centro CICLA: arranca en 300, sube 20 cada cinco segundos y al llegar a 500 vuelve
    a cero, animando cada paso. Con movimiento reducido NO cicla: un numero que cambia solo es
    movimiento, y del que peor sienta.

  DECISIONES YA TOMADAS (no reabrir sin motivo nuevo)
  - Sin entidad Family: parentId apunta directo a User. Un niño, un padre.
  - El niño NO es un User: vive entero como ChildProfile dentro de la cuenta de su padre, y
    accede con perfil + PIN. No tiene correo ni nombre de usuario.
  - No hay columna de rol en la base de datos: solo los padres son User, así que valdría
    siempre PARENT. FamilyRole existe como tipo de dominio y discrimina el actor.
  - El saldo vive en ChildProfile.coins como fuente de verdad; una tabla de historial
    append-only registra cada movimiento, con el saldo resultante de cada uno.
  - Task.coins tiene rango 1-9999. El estado TaskStatus.REJECTED no existe: rechazar una tarea
    la devuelve a PENDING.
  - Dar de baja un hijo o retirar un premio es lógico, nunca destruye historial. La baja de un hijo
    es ademas DEFINITIVA: no hay reactivacion.
  - El saldo solo se mueve con tareas y canjes. No hay ajuste manual: CoinReason.MANUAL_ADJUSTMENT
    existe en el enum pero ningun endpoint lo produce, y desde add-tasks tampoco la siembra.
  - DELETE /tasks es borrado FISICO, y solo en PENDING. Era una pregunta abierta y la cierra
    add-tasks: la condicion de estado es lo que garantiza que nunca se intente borrar una tarea
    con historial de monedas detras, cuya clave ajena restrictiva lo impediria de todas formas.
    En COMPLETED tampoco se borra, y eso no es un limite tecnico sino de producto: el niño hizo
    el trabajo y merece una respuesta, sea aprobarla o rechazarla.
  - Corregir una acreditacion equivocada NO se hace editando el historial, que es inmutable, sino
    registrando un movimiento que la compense. Ese mecanismo todavia no lo expone ningun endpoint,
    y despues de `add-coin-history` sigue sin exponerlo: ese change solo LEE.
    Lo que costaria, ya medido, para que la proxima vez se decida con el precio delante: crear un
    movimiento MUEVE dinero, asi que es transaccion interactiva en el repositorio,
    `applyCoinMovement`, comprobacion de fila afectada y tests de doble tap. Es un change entero y
    no un endpoint mas. Y quedan tres decisiones de producto sin tomar: si el importe tiene limites,
    si el motivo es obligatorio, y como se cuenta que un ajuste no puede dejar el saldo negativo
    -el motor ya lo rechaza con un CHECK, asi que la interfaz tiene que explicarlo antes de pedirlo-.
    La necesidad quedo mas visible, no menos: ahora el niño LEE el historial, asi que un error
    acreditado es algo que el niño ve y que nadie puede arreglar desde dentro del producto.
  - Cambiar un PIN sabiendo el actual NO revoca sesiones, ni la propia ni la de otro dispositivo.
    Para echar a alguien de otro dispositivo esta cerrar la sesion de cuenta, que si revoca.
  - Los avatares y las imágenes se suben a S3 (bucket privado, URLs firmadas de corta vida). Ya
    construido en `add-file-storage`, detrás de la interfaz `StorageProvider`.
  - Un avatar propio CONVIVE con el catálogo de 12 animales, no lo reemplaza: son dos formas del
    mismo campo, y por eso ningún perfil existente necesitó migrarse.
  - Los objetos huérfanos NO se borran (avatar reemplazado, premio retirado): se acepta que el bucket
    crezca. Un borrado sin transacción distribuida es siempre a mejor esfuerzo, y equivocarse
    borrando pesa más que guardar de más con este volumen.

  ABIERTO
  - Cuántos dígitos tiene el PIN y con qué algoritmo se hashean las credenciales: se cierra en
    add-authentication.

rules:
  proposal:
    - Redactar en español.
    - Incluir siempre una sección de "No incluye" que delimite el alcance.
    - No repetir el contexto del proyecto; asumirlo conocido.
  design:
    - Redactar en español, con diagramas ASCII cuando aclaren más que el texto.
    - Documentar las alternativas descartadas y por qué.
    - Señalar explícitamente las decisiones que se difieren a un change posterior.
  specs:
    - Redactar en español.
    - Cada requisito debe ser verificable y llevar al menos un escenario concreto.
    - Cubrir los caminos de error y de autorización, no solo el camino feliz.
  tasks:
    - Redactar en español.
    - Tareas de como máximo 2 horas, en orden ejecutable.
    - Incluir las tareas de test junto a la funcionalidad que cubren, no al final.
