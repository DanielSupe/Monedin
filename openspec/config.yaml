schema: spec-driven

context: |
  Las reglas de desarrollo vinculantes viven en CLAUDE.md, en la raíz del repositorio:
  anatomía de módulo, patrón de actor, contrato de errores, atomicidad del saldo y
  exigencia de tests. Este contexto no las repite; da el marco de producto y las
  decisiones ya cerradas.

  PRODUCTO
  Monedín: plataforma de educación financiera gamificada para niños de 6 a 11 años.
  Los padres asignan tareas con valor en monedas y publican premios con precio en monedas.
  El niño gana monedas completando tareas (con aprobación del padre) y las gasta canjeando
  premios (también con aprobación). La moneda es virtual y cerrada a la familia: no hay dinero
  real, no hay pagos, no hay interoperabilidad entre familias.
  Primer mercado: Latinoamérica hispanohablante.

  Lo que enseña, y que ninguna decisión debe diluir: el ciclo esfuerzo → ingreso → decisión
  de gasto. No es una app bancaria para niños ni un gestor de tareas: la clave es que las
  tareas valen monedas y los premios cuestan monedas.
  Para el padre es una herramienta de gestión del hogar con impacto educativo; para el niño,
  una experiencia de autonomía donde ve su saldo y elige sus metas.

  STACK
  Monorepo con pnpm workspaces + Turborepo. Node 22 LTS, TypeScript strict.
  - apps/api: Express + Prisma 7 + PostgreSQL 16.
  - apps/web: Vite + React + TanStack Query + TanStack Router.
  - packages/contracts: schemas Zod, tipos y constantes de dominio compartidos front/back.
  - packages/config: tsconfig, eslint y prettier compartidos.
  Infra local: docker-compose con PostgreSQL 16 + Adminer.
  Archivos subidos (imágenes, documentos): S3 detrás de una interfaz StorageProvider.
  Tests: Vitest + Supertest, contra PostgreSQL real en una base separada.

  ARQUITECTURA
  Arquitectura por módulos. Cada módulo de la API tiene la misma anatomía:
    modules/<name>/<name>.routes.ts       monta rutas, cero lógica
    modules/<name>/<name>.controller.ts   parsea y serializa, cero autorización
    modules/<name>/<name>.service.ts      reglas de negocio Y autorización
    modules/<name>/<name>.repository.ts   único lugar que toca Prisma
    modules/<name>/<name>.errors.ts       errores de dominio del módulo
  El módulo health es la plantilla ejecutable de esa anatomía.

  La autorización se valida en la capa de negocio, nunca en el controlador. El controlador
  construye el actor desde la sesión y lo pasa como primer argumento: service.method(actor, dto).
  El actor es una unión discriminada, porque el niño no es un User y no tiene userId:
    { familyRole: "PARENT", userId }
    { familyRole: "CHILD", childProfileId, parentId }

  MODELO DE DATOS (ya implementado, ver apps/api/prisma/schema.prisma)
  User (solo el padre) · ChildProfile (el niño entero: nombre, PIN, saldo, edad, avatar,
  baja lógica) · Task · Reward · RewardAssignment (precio por niño, clave compuesta) ·
  RewardRedemption (precio congelado al solicitar) · CoinTransaction (historial append-only).

  El motor garantiza los invariantes, no solo el código: CHECK para saldo no negativo, rangos
  de monedas y de edad, y un disparador que hace inmutable el historial.

  MÁQUINAS DE ESTADO
  Tarea:  PENDING --(el niño la marca)--> COMPLETED --(el padre aprueba)--> APPROVED [+monedas]
          COMPLETED --(el padre rechaza)--> PENDING. Solo se edita en PENDING.
          Completar solo el niño dueño; aprobar y rechazar solo el padre dueño.
  Canje:  PENDING --(aprueba)--> APPROVED [-monedas]  |  PENDING --(rechaza)--> REJECTED (terminal).
          El niño solo puede pedir un premio que exista, esté activo, esté asignado a él y cuyo
          precio no supere su saldo. El saldo se valida DOS veces: al solicitar y al aprobar.

  SUPERFICIE DE LA API PREVISTA (todo bajo /api/v1)
  Lo ya construido:
    GET /health  público, sonda de vida, no consulta la base de datos.
    /children   POST de SOLO CUENTA: se crea desde la rejilla sin PIN de adulto, porque crear un
                perfil es otro de los pasos previos a ser alguien. Un perfil de NIÑO activo no
                puede (403). Tope de hijos activos por familia impuesto en el servicio (409).
                GET paginado y GET /:id (padre, solo hijos propios). Ajeno o dado de baja -> 404,
                nunca 403, para no confirmar que existe.
                PATCH /:id (padre): nombre, edad y avatar. NUNCA el saldo.
                DELETE /:id (padre): baja LOGICA y DEFINITIVA, sin reactivacion. Revoca las
                sesiones abiertas de ese perfil y conserva su historial.
                GET y PATCH /children/me (niño): su perfil con su saldo, y su avatar. El perfil
                sale de la sesion y nunca de la peticion, asi que no ve a sus hermanos.
                El PIN propio del niño NO vive aqui: POST /auth/child-profiles/me/pin, porque
                cambiar una credencial toca la tabla de sesiones y esa es exclusiva de auth.
                Estas rutas estrenaron el patron de paginacion del proyecto.
    /tasks      POST (padre) acepta DOS formas y debe cumplirse EXACTAMENTE una:
                  A) { childIds: [...], coins }  mismo valor para todos
                  B) { assignments: [{ childId, coins }] }  valor distinto por hijo
                Se crea UNA FILA POR HIJO y se devuelve el array. El reparto es TODO O NADA:
                se comprueban todos los hijos antes de crear nada, y un hijo ajeno, inexistente
                o dado de baja da 404 -> nunca 403, para no confirmar que existe. (El boceto
                decia 403 para el ajeno; se corrigio en add-tasks por coherencia con /children.)
                Las filas creadas en el mismo POST comparten `batchId`, que es el REPARTO.
                GET (padre) devuelve los repartos AGRUPADOS y pagina POR REPARTO, con filtros
                por estado y por hijo. Filtrar por COMPLETED es la bandeja de aprobacion. El
                filtro por estado ensena el reparto entero; el de hijo acota tambien las filas.
                GET /tasks/mine (niño) su lista plana, tomada de la sesion y nunca de la query.
                GET /:id (ambos roles, cada uno con su vista, filtrando por pertenencia).
                PATCH /:id (padre, solo en PENDING). DELETE /:id (padre, solo en PENDING).
                POST /:id/complete (niño) · /approve y /reject (padre). POST y no PATCH:
                aprobar tiene efecto secundario sobre el saldo y no es idempotente.
                Aprobar ACREDITA en la misma transaccion que el cambio de estado, condicionado
                al estado de origen: dos toques dan una acreditacion y un 409.
  Lo que falta, con las reglas que ya están decididas:
    /rewards    catálogo del padre, con asignación y precio por hijo. Sin diseñar todavía.
    /redemptions  solicitud del niño y resolución del padre. Sin diseñar todavía.

  DECISIONES YA TOMADAS (no reabrir sin motivo nuevo)
  - Sin entidad Family: parentId apunta directo a User. Un niño, un padre.
  - El niño NO es un User: vive entero como ChildProfile dentro de la cuenta de su padre, y
    accede con perfil + PIN. No tiene correo ni nombre de usuario.
  - No hay columna de rol en la base de datos: solo los padres son User, así que valdría
    siempre PARENT. FamilyRole existe como tipo de dominio y discrimina el actor.
  - El saldo vive en ChildProfile.coins como fuente de verdad; una tabla de historial
    append-only registra cada movimiento, con el saldo resultante de cada uno.
  - Task.coins tiene rango 1-9999. El estado TaskStatus.REJECTED no existe: rechazar una tarea
    la devuelve a PENDING.
  - Dar de baja un hijo o retirar un premio es lógico, nunca destruye historial. La baja de un hijo
    es ademas DEFINITIVA: no hay reactivacion.
  - El saldo solo se mueve con tareas y canjes. No hay ajuste manual: CoinReason.MANUAL_ADJUSTMENT
    existe en el enum pero ningun endpoint lo produce, y desde add-tasks tampoco la siembra.
  - DELETE /tasks es borrado FISICO, y solo en PENDING. Era una pregunta abierta y la cierra
    add-tasks: la condicion de estado es lo que garantiza que nunca se intente borrar una tarea
    con historial de monedas detras, cuya clave ajena restrictiva lo impediria de todas formas.
    En COMPLETED tampoco se borra, y eso no es un limite tecnico sino de producto: el niño hizo
    el trabajo y merece una respuesta, sea aprobarla o rechazarla.
  - Corregir una acreditacion equivocada NO se hace editando el historial, que es inmutable, sino
    registrando un movimiento que la compense. Ese mecanismo todavia no lo expone ningun endpoint.
  - Cambiar un PIN sabiendo el actual NO revoca sesiones, ni la propia ni la de otro dispositivo.
    Para echar a alguien de otro dispositivo esta cerrar la sesion de cuenta, que si revoca.
  - Los avatares y las imágenes se suben a S3 (bucket privado, URLs firmadas de corta vida).

  ABIERTO
  - Cuántos dígitos tiene el PIN y con qué algoritmo se hashean las credenciales: se cierra en
    add-authentication.

rules:
  proposal:
    - Redactar en español.
    - Incluir siempre una sección de "No incluye" que delimite el alcance.
    - No repetir el contexto del proyecto; asumirlo conocido.
  design:
    - Redactar en español, con diagramas ASCII cuando aclaren más que el texto.
    - Documentar las alternativas descartadas y por qué.
    - Señalar explícitamente las decisiones que se difieren a un change posterior.
  specs:
    - Redactar en español.
    - Cada requisito debe ser verificable y llevar al menos un escenario concreto.
    - Cubrir los caminos de error y de autorización, no solo el camino feliz.
  tasks:
    - Redactar en español.
    - Tareas de como máximo 2 horas, en orden ejecutable.
    - Incluir las tareas de test junto a la funcionalidad que cubren, no al final.
