<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif; }
    a { color: #6C4BD6; text-decoration: none; }
    a:hover { color: #5A3CBE; }
  </style>
</helmet>

<div style="position: relative; display: flex; flex-direction: column; width: 1440px; height: 900px; overflow: hidden; background: #FFF7EC; color: #2A2438;">

  <div style="position: absolute; inset: 0; pointer-events: none;">
    <div style="position: absolute; top: -160px; left: -120px; width: 440px; height: 440px; border-radius: 50%; background: #FFF3DE;"></div>
    <div style="position: absolute; bottom: -190px; right: -130px; width: 470px; height: 470px; border-radius: 50%; background: #F1EDFD;"></div>
    <svg width="46" height="46" viewBox="0 0 32 32" style="position: absolute; top: 230px; left: 210px;"><circle cx="16" cy="16" r="15" fill="#FBE2A8"></circle><path d="M11 21V11l5 6 5-6v10" fill="none" stroke="#E0B45E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <svg width="34" height="34" viewBox="0 0 24 24" style="position: absolute; bottom: 210px; right: 250px;"><path d="M12 2l2.4 6.2L21 10.6l-6.6 2.4L12 19l-2.4-6L3 10.6l6.6-2.4z" fill="#FFC9BB"></path></svg>
    <svg width="28" height="28" viewBox="0 0 24 24" style="position: absolute; top: 190px; right: 340px;"><path d="M12 2l2.4 6.2L21 10.6l-6.6 2.4L12 19l-2.4-6L3 10.6l6.6-2.4z" fill="#E4DDFA"></path></svg>
  </div>

  <header style="position: relative; padding: 34px 40px;">
    <span style="display: flex; align-items: center; gap: 10px;">
      <svg width="34" height="34" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="15" fill="#F5B93B"></circle>
        <circle cx="16" cy="16" r="11.5" fill="none" stroke="#8A5A10" stroke-width="1.5"></circle>
        <path d="M11 21V11l5 6 5-6v10" fill="none" stroke="#8A5A10" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.02em; color: #2A2438;">Monedín</span>
    </span>
  </header>

  <main style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; flex-grow: 1; padding: 0 40px 70px 40px;">
    <section style="display: flex; flex-direction: column; gap: 18px; width: 430px; box-sizing: border-box; padding: 30px 34px; border-radius: 28px; background: #FFFFFF; border: 1px solid #F0E6D8; box-shadow: 0 2px 4px rgba(42,36,56,0.05), 0 18px 42px rgba(42,36,56,0.09);">
      <div style="display: flex; align-items: center; gap: 14px;">
        <img src="duda.png" alt="" style="width: 76px; height: auto;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <h1 style="margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.02em;">Restablecer PIN</h1>
          <p style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.4; color: #6B6053; text-wrap: pretty;">Estás bloqueado fuera de tu perfil. Con tu contraseña puedes ponerte un PIN nuevo.</p>
        </div>
      </div>

        <label style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 15px; font-weight: 900;">Contraseña</span>
          <input type="password" value="••••••••••" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #E3D6C4; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; color: #2A2438;">
          <span style="font-size: 13px; font-weight: 700; color: #6B6053;">La de tu cuenta. Es lo que demuestra que eres tú.</span>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 15px; font-weight: 900;">PIN nuevo</span>
          <input type="password" value="••••" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #E3D6C4; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; color: #2A2438;">
          <span style="font-size: 13px; font-weight: 700; color: #6B6053;">Lo que teclearás para entrar a tu perfil a partir de ahora.</span>
        </label>

        <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 50px; border: 0; border-radius: 14px; background: #FF6B4A; font-family: inherit; font-size: 16px; font-weight: 900; color: #FFFFFF; cursor: pointer; box-shadow: 0 6px 16px rgba(255,107,74,0.3);">
          Restablecer
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"></path><path d="M13.5 6.5L20 12l-6.5 5.5"></path></svg>
        </button>
    </section>

  </main>
  <a href="#" style="position: absolute; left: 40px; bottom: 34px; display: inline-flex; align-items: center; gap: 9px; padding: 0 20px; min-height: 48px; box-sizing: border-box; border-radius: 999px; border: 1px solid #EADFCF; background: #FFFFFF; font-size: 16px; font-weight: 800; color: #464154;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7A7590" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    Volver
  </a>
</div>
</x-dc>
</body>
</html>
