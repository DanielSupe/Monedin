<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif; }
    a { color: #6C4BD6; text-decoration: none; }
    a:hover { color: #5A3CBE; }
  </style>
</helmet>

<div style="position: relative; display: flex; flex-direction: column; width: 1440px; height: 900px; overflow: hidden; background: #FFF7EC; color: #2A2438;">

  <!-- Formas: el escenario, más presente que en una pantalla de listado. -->
  <div style="position: absolute; inset: 0; pointer-events: none;">
    <div style="position: absolute; top: -170px; right: -130px; width: 470px; height: 470px; border-radius: 50%; background: #FFEDD9;"></div>
    <div style="position: absolute; bottom: -200px; left: -150px; width: 490px; height: 490px; border-radius: 50%; background: #EFE9FC;"></div>
    <div style="position: absolute; top: 120px; left: 150px; width: 150px; height: 150px; border-radius: 44px; background: #EDE8FC; transform: rotate(-16deg);"></div>
    <svg width="56" height="56" viewBox="0 0 32 32" style="position: absolute; top: 300px; left: 300px;">
      <circle cx="16" cy="16" r="15" fill="#F8D07A"></circle>
      <path d="M11 21V11l5 6 5-6v10" fill="none" stroke="#C99527" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <svg width="38" height="38" viewBox="0 0 32 32" style="position: absolute; bottom: 230px; left: 420px;">
      <circle cx="16" cy="16" r="15" fill="#F8D07A"></circle>
      <path d="M11 21V11l5 6 5-6v10" fill="none" stroke="#C99527" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <svg width="44" height="44" viewBox="0 0 24 24" style="position: absolute; bottom: 260px; right: 260px;">
      <path d="M12 2l2.4 6.2L21 10.6l-6.6 2.4L12 19l-2.4-6L3 10.6l6.6-2.4z" fill="#FFC9BB"></path>
    </svg>
    <svg width="30" height="30" viewBox="0 0 24 24" style="position: absolute; top: 220px; right: 420px;">
      <path d="M12 2l2.4 6.2L21 10.6l-6.6 2.4L12 19l-2.4-6L3 10.6l6.6-2.4z" fill="#D6CBF6"></path>
    </svg>
  </div>

  <header style="position: relative; padding: 34px 40px;">
    <span style="display: flex; align-items: center; gap: 10px;">
      <svg width="34" height="34" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="15" fill="#F5B93B"></circle>
        <circle cx="16" cy="16" r="11.5" fill="none" stroke="#8A5A10" stroke-width="1.5"></circle>
        <path d="M11 21V11l5 6 5-6v10" fill="none" stroke="#8A5A10" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.02em;">Monedín</span>
    </span>
  </header>

  <main style="position: relative; display: flex; align-items: center; justify-content: center; flex-grow: 1; padding: 0 40px 60px 40px;">

    <section style="overflow: hidden; width: 430px; box-sizing: border-box; border-radius: 34px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(42,36,56,0.05), 0 20px 46px rgba(42,36,56,0.1);">

      <!-- La cabecera dice de QUIÉN es el PIN que se está pidiendo. -->
      <div style="position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 24px 20px 24px; background: linear-gradient(125deg, #FF7C5A 0%, #FF6B4A 58%, #F5533A 100%);">
        <div style="position: absolute; top: -70px; right: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,0.12);"></div>
        <div style="position: absolute; bottom: -90px; left: -50px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,0.09);"></div>

        <span style="position: relative; display: flex; align-items: center; justify-content: center; width: 92px; height: 92px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 8px 18px rgba(180,60,35,0.2);">
          <svg width="66" height="66" viewBox="0 0 40 40">
            <path d="M8 9l5 6h14l5-6 1 11c0 8-5 13-13 13S7 28 7 20z" fill="#EE8B4A"></path>
            <path d="M13 15h14l.6 6c0 6-3.6 10-7.6 10s-7.6-4-7.6-10z" fill="#FFE7D2"></path>
            <circle cx="16" cy="21" r="2.1" fill="#3A2A16"></circle><circle cx="24" cy="21" r="2.1" fill="#3A2A16"></circle>
            <ellipse cx="20" cy="24.4" rx="2" ry="1.5" fill="#3A2A16"></ellipse>
          </svg>
        </span>

        <p style="position: relative; margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.02em; color: #FFFFFF;">Mateo</p>
        <p style="position: relative; margin: 0; font-size: 17px; font-weight: 800; color: rgba(255,255,255,0.9);">Escribe tu PIN</p>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 22px 36px 26px 36px;">

        <!-- Cuatro huecos: los dos primeros ya tecleados. -->
        <div style="display: flex; gap: 14px;">
          <span style="display: block; width: 22px; height: 22px; border-radius: 50%; background: #FF6B4A;"></span>
          <span style="display: block; width: 22px; height: 22px; border-radius: 50%; background: #FF6B4A;"></span>
          <span style="display: block; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; border: 3px solid #F3DCC7; box-sizing: border-box;"></span>
          <span style="display: block; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; border: 3px solid #F3DCC7; box-sizing: border-box;"></span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%;">
          <button type="button" style="min-height: 66px; border: 0; border-radius: 22px; background: #FFF1DF; font-family: inherit; font-size: 27px; font-weight: 900; color: #8A5A10; cursor: pointer;">1</button>
          <button type="button" style="min-height: 66px; border: 0; border-radius: 22px; background: #FFF1DF; font-family: inherit; font-size: 27px; font-weight: 900; color: #8A5A10; cursor: pointer;">2</button>
          <button type="button" style="min-height: 66px; border: 0; border-radius: 22px; background: #FFF1DF; font-family: inherit; font-size: 27px; font-weight: 900; color: #8A5A10; cursor: pointer;">3</button>
          <button type="button" style="min-height: 66px; border: 0; border-radius: 22px; background: #F3E7D4; font-family: inherit; font-size: 27px; font-weight: 900; color: #6B6053; cursor: pointer;">4</button>
          <button type="button" style="min-height: 66px; border: 0; border-radius: 22px; background: #F3E7D4; font-family: inherit; font-size: 27px; font-weight: 900; color: #6B6053; cursor: pointer;">5</button>
          <button type="button" style="min-height: 66px; border: 0; border-radius: 22px; background: #F3E7D4; font-family: inherit; font-size: 27px; font-weight: 900; color: #6B6053; cursor: pointer;">6</button>
          <button type="button" style="min-height: 66px; border: 0; border-radius: 22px; background: #F1ECFD; font-family: inherit; font-size: 27px; font-weight: 900; color: #5A3CBE; cursor: pointer;">7</button>
          <button type="button" style="min-height: 66px; border: 0; border-radius: 22px; background: #F1ECFD; font-family: inherit; font-size: 27px; font-weight: 900; color: #5A3CBE; cursor: pointer;">8</button>
          <button type="button" style="min-height: 66px; border: 0; border-radius: 22px; background: #F1ECFD; font-family: inherit; font-size: 27px; font-weight: 900; color: #5A3CBE; cursor: pointer;">9</button>
          <span></span>
          <button type="button" style="min-height: 66px; border: 0; border-radius: 22px; background: #FFE9E2; font-family: inherit; font-size: 27px; font-weight: 900; color: #C7452A; cursor: pointer;">0</button>
          <button type="button" aria-label="Borrar" style="display: flex; align-items: center; justify-content: center; min-height: 66px; border: 2px solid #F3DCC7; border-radius: 22px; background: #FFFFFF; cursor: pointer;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#A08F86" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 5.5h10.5v13H9L3.5 12z"></path><path d="M12.5 9.5l4 5"></path><path d="M16.5 9.5l-4 5"></path>
            </svg>
          </button>
        </div>

        <a href="#" style="font-size: 16px; font-weight: 900;">¿Olvidaste tu PIN?</a>
      </div>
    </section>

    <!-- Monedín acompaña también aquí, que es la primera pantalla del niño. -->
    <div style="position: absolute; left: calc(50% + 245px); bottom: 130px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 240px;">
      <div style="padding: 14px 18px; border-radius: 22px 22px 22px 6px; background: #FFFFFF; border: 1px solid #F0E6D8; box-shadow: 0 8px 22px rgba(42,36,56,0.07);">
        <p style="margin: 0; font-size: 16px; font-weight: 800; line-height: 1.4; color: #2A2438; text-wrap: pretty;">Son tus 4 números secretos. Si se te olvidan, pídele ayuda a un adulto.</p>
      </div>
      <img src="duda.png" alt="" style="width: 132px; height: auto; align-self: flex-start;">
    </div>
  </main>

  <a href="#" style="position: absolute; left: 40px; bottom: 34px; display: inline-flex; align-items: center; gap: 9px; padding: 0 20px; min-height: 48px; box-sizing: border-box; border-radius: 999px; border: 1px solid #EADFCF; background: #FFFFFF; font-size: 16px; font-weight: 800; color: #464154;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7A7590" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 6l-6 6 6 6"></path>
    </svg>
    Volver
  </a>
</div>
</x-dc>
</body>
</html>
