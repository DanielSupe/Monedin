<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif; }
    a { color: #6C4BD6; text-decoration: none; }
    a:hover { color: #5A3CBE; }
  </style>
</helmet>

<!-- El marco de entrada: logo arriba a la izquierda y contenido centrado. -->
<div style="position: relative; display: flex; flex-direction: column; width: 1440px; height: 900px; overflow: hidden; background: #FFF7EC; color: #2A2438;">

  <!-- Formas: el escenario de la casa antes de ser nadie. -->
  <div style="position: absolute; inset: 0; pointer-events: none;">
    <div style="position: absolute; top: -140px; left: -110px; width: 420px; height: 420px; border-radius: 50%; background: #FFF3DE;"></div>
    <div style="position: absolute; bottom: -180px; right: -120px; width: 460px; height: 460px; border-radius: 50%; background: #F1EDFD;"></div>
    <div style="position: absolute; top: 120px; right: 190px; width: 150px; height: 150px; border-radius: 42px; background: linear-gradient(140deg, #E2DAFB 0%, #B9A6F2 100%); transform: rotate(18deg);"></div>
    <svg width="46" height="46" viewBox="0 0 32 32" style="position: absolute; top: 210px; left: 190px;">
      <circle cx="16" cy="16" r="15" fill="#FBE2A8"></circle>
      <path d="M11 21V11l5 6 5-6v10" fill="none" stroke="#E0B45E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <svg width="30" height="30" viewBox="0 0 32 32" style="position: absolute; bottom: 170px; left: 300px;">
      <circle cx="16" cy="16" r="15" fill="#FBE2A8"></circle>
      <path d="M11 21V11l5 6 5-6v10" fill="none" stroke="#E0B45E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <svg width="52" height="52" viewBox="0 0 32 32" style="position: absolute; top: 140px; right: 120px;">
      <circle cx="16" cy="16" r="15" fill="#F8D07A"></circle>
      <path d="M11 21V11l5 6 5-6v10" fill="none" stroke="#C99527" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <svg width="36" height="36" viewBox="0 0 24 24" style="position: absolute; bottom: 190px; left: 150px;">
      <path d="M12 2l2.4 6.2L21 10.6l-6.6 2.4L12 19l-2.4-6L3 10.6l6.6-2.4z" fill="#FFC9BB"></path>
    </svg>
    <svg width="42" height="42" viewBox="0 0 24 24" style="position: absolute; bottom: 240px; right: 300px;">
      <path d="M12 2l2.4 6.2L21 10.6l-6.6 2.4L12 19l-2.4-6L3 10.6l6.6-2.4z" fill="#E4DDFA"></path>
    </svg>
  </div>

  <header style="position: relative; padding: 34px 40px;">
    <span style="display: flex; align-items: center; gap: 10px;">
      <svg width="34" height="34" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="15" fill="#F5B93B"></circle>
        <circle cx="16" cy="16" r="11.5" fill="none" stroke="#8A5A10" stroke-width="1.5"></circle>
        <path d="M11 21V11l5 6 5-6v10" fill="none" stroke="#8A5A10" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.02em;">Monedín</span>
    </span>
  </header>

  <!-- Un marco centra; el ancho lo declara la pantalla: aquí, una fila de caras. -->
  <main style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; flex-grow: 1; padding: 0 40px 80px 40px;">

    <section style="position: relative; overflow: hidden; display: flex; align-items: center; gap: 20px; padding: 14px 34px 14px 18px; border-radius: 30px; background: linear-gradient(120deg, #FF7C5A 0%, #FF6B4A 58%, #F5533A 100%); box-shadow: 0 14px 34px rgba(255,107,74,0.28);">
      <div style="position: absolute; top: -70px; right: 90px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.1);"></div>
      <div style="position: absolute; bottom: -86px; left: 260px; width: 190px; height: 190px; border-radius: 50%; background: rgba(255,255,255,0.07);"></div>
      <img src="saluda.png" alt="" style="position: relative; width: 104px; height: auto;">
      <div style="position: relative; display: flex; flex-direction: column; gap: 2px;">
        <h1 style="margin: 0; font-size: 46px; font-weight: 900; letter-spacing: -0.03em; color: #FFFFFF;">¿Quién eres?</h1>
        <p style="margin: 0; font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.9);">Toca tu cara y escribe tu PIN.</p>
      </div>
    </section>

    <ul style="display: flex; align-items: stretch; gap: 22px; margin: 0; padding: 0; list-style: none;">

      <li>
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 14px; width: 186px; box-sizing: border-box; padding: 26px 18px 22px 18px; border-radius: 26px; background: #FFFFFF; border: 3px solid #6C4BD6; box-shadow: 0 1px 2px rgba(42,36,56,0.04), 0 10px 24px rgba(42,36,56,0.05);">
          <span style="display: flex; align-items: center; justify-content: center; width: 104px; height: 104px; border-radius: 50%; background: linear-gradient(140deg, #E2DAFB 0%, #B9A6F2 100%);">
            <svg width="72" height="72" viewBox="0 0 40 40">
              <circle cx="20" cy="14.5" r="7" fill="#6C4BD6"></circle>
              <path d="M7 34c0-7 5.8-11 13-11s13 4 13 11z" fill="#6C4BD6"></path>
            </svg>
          </span>
          <span style="font-size: 22px; font-weight: 900;">Laura</span>
          <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: linear-gradient(140deg, #E2DAFB 0%, #B9A6F2 100%); font-size: 14px; font-weight: 800; color: #5A3CBE;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5A3CBE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"></rect><path d="M8 10.5V8a4 4 0 018 0v2.5"></path>
            </svg>
            Adulto
          </span>
        </a>
      </li>

      <li>
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 14px; width: 186px; box-sizing: border-box; padding: 26px 18px 22px 18px; border-radius: 26px; background: #FFFFFF; border: 3px solid #FF6B4A; box-shadow: 0 1px 2px rgba(42,36,56,0.04), 0 10px 24px rgba(42,36,56,0.05);">
          <span style="display: flex; align-items: center; justify-content: center; width: 104px; height: 104px; border-radius: 50%; background: linear-gradient(140deg, #FFD9CC 0%, #FFB49C 100%);">
            <svg width="76" height="76" viewBox="0 0 40 40">
              <path d="M8 9l5 6h14l5-6 1 11c0 8-5 13-13 13S7 28 7 20z" fill="#EE8B4A"></path>
              <path d="M13 15h14l.6 6c0 6-3.6 10-7.6 10s-7.6-4-7.6-10z" fill="#FFE7D2"></path>
              <circle cx="16" cy="21" r="2.1" fill="#3A2A16"></circle><circle cx="24" cy="21" r="2.1" fill="#3A2A16"></circle>
              <ellipse cx="20" cy="24.4" rx="2" ry="1.5" fill="#3A2A16"></ellipse>
              <path d="M20 26v1.6" stroke="#3A2A16" stroke-width="1.4" stroke-linecap="round"></path>
            </svg>
          </span>
          <span style="font-size: 22px; font-weight: 900;">Mateo</span>
          <span style="font-size: 15px; font-weight: 700; color: #7A7590;">8 años</span>
        </a>
      </li>

      <li>
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 14px; width: 186px; box-sizing: border-box; padding: 26px 18px 22px 18px; border-radius: 26px; background: #FFFFFF; border: 3px solid #6C4BD6; box-shadow: 0 1px 2px rgba(42,36,56,0.04), 0 10px 24px rgba(42,36,56,0.05);">
          <span style="display: flex; align-items: center; justify-content: center; width: 104px; height: 104px; border-radius: 50%; background: linear-gradient(140deg, #E2DAFB 0%, #B9A6F2 100%);">
            <svg width="76" height="76" viewBox="0 0 40 40">
              <circle cx="11.5" cy="11" r="4.6" fill="#2F3446"></circle>
              <circle cx="28.5" cy="11" r="4.6" fill="#2F3446"></circle>
              <circle cx="20" cy="21" r="12" fill="#FFFFFF"></circle>
              <ellipse cx="14.6" cy="19.4" rx="3.5" ry="4.2" fill="#2F3446" transform="rotate(-14 14.6 19.4)"></ellipse>
              <ellipse cx="25.4" cy="19.4" rx="3.5" ry="4.2" fill="#2F3446" transform="rotate(14 25.4 19.4)"></ellipse>
              <circle cx="15" cy="19.4" r="1.5" fill="#FFFFFF"></circle><circle cx="25" cy="19.4" r="1.5" fill="#FFFFFF"></circle>
              <ellipse cx="20" cy="25" rx="2.2" ry="1.6" fill="#2F3446"></ellipse>
              <path d="M20 26.6c-1.4 1.4-3 1-3.6 0" fill="none" stroke="#2F3446" stroke-width="1.5" stroke-linecap="round"></path>
              <path d="M20 26.6c1.4 1.4 3 1 3.6 0" fill="none" stroke="#2F3446" stroke-width="1.5" stroke-linecap="round"></path>
            </svg>
          </span>
          <span style="font-size: 22px; font-weight: 900;">Emma</span>
          <span style="font-size: 15px; font-weight: 700; color: #7A7590;">6 años</span>
        </a>
      </li>

      <!-- Bloqueado: se dice en la tesela, antes de teclear nada. -->
      <li>
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 14px; width: 186px; box-sizing: border-box; padding: 26px 18px 22px 18px; border-radius: 26px; background: #FFFFFF; border: 3px solid #E3D6C4; box-shadow: 0 1px 2px rgba(42,36,56,0.04), 0 10px 24px rgba(42,36,56,0.05);">
          <span style="display: flex; align-items: center; justify-content: center; width: 104px; height: 104px; border-radius: 50%; background: linear-gradient(140deg, #F2EADC 0%, #DCCDB6 100%); opacity: 0.62;">
            <svg width="76" height="76" viewBox="0 0 40 40">
              <path d="M20 6c7 0 11 5.5 11 12.5S27 33 20 33 9 25.5 9 18.5 13 6 20 6z" fill="#A98A5E"></path>
              <path d="M12 8.5l3.4 4.2-4.6 1z" fill="#8E7047"></path>
              <path d="M28 8.5l-3.4 4.2 4.6 1z" fill="#8E7047"></path>
              <circle cx="15.2" cy="18" r="5" fill="#FFF6E6"></circle>
              <circle cx="24.8" cy="18" r="5" fill="#FFF6E6"></circle>
              <circle cx="15.2" cy="18" r="2.4" fill="#2F3446"></circle>
              <circle cx="24.8" cy="18" r="2.4" fill="#2F3446"></circle>
              <path d="M20 21.5l-2.4 3h4.8z" fill="#E8A33C"></path>
              <path d="M14.5 27.5h11" stroke="#8E7047" stroke-width="1.6" stroke-linecap="round"></path>
            </svg>
          </span>
          <span style="font-size: 22px; font-weight: 900; color: #7A7590;">Lucas</span>
          <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: #F9E4DC; font-size: 14px; font-weight: 800; color: #B5533A;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B5533A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"></rect><path d="M8 10.5V8a4 4 0 018 0v2.5"></path>
            </svg>
            Bloqueado
          </span>
        </a>
      </li>

      <li>
        <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; width: 186px; height: 100%; box-sizing: border-box; padding: 26px 18px; border-radius: 26px; background: transparent; border: 2px dashed #E3D6C4;">
          <span style="display: flex; align-items: center; justify-content: center; width: 76px; height: 76px; border-radius: 50%; background: #FFFFFF; border: 1px solid #F0E6D8;">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#6C4BD6" stroke-width="2.6" stroke-linecap="round">
              <path d="M12 5v14"></path><path d="M5 12h14"></path>
            </svg>
          </span>
          <span style="font-size: 18px; font-weight: 900; color: #5A3CBE; text-align: center;">Crear perfil</span>
        </a>
      </li>
    </ul>

    <a href="#" style="display: inline-flex; align-items: center; gap: 9px; padding: 0 20px; min-height: 48px; box-sizing: border-box; border-radius: 999px; border: 1px solid #EADFCF; background: #FFFFFF; font-size: 16px; font-weight: 800; color: #464154;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7A7590" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16.5L15 5.5l3.5 3.5L7.5 20H4z"></path><path d="M13 7.5l3.5 3.5"></path>
      </svg>
      Administrar perfiles
    </a>
  </main>
</div>
</x-dc>
</body>
</html>
